<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Wall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,Helvetica,sans-serif}
header{padding:28px 18px 16px;text-align:center;border-bottom:1px solid #333}
h1{margin:0;font-size:32px;letter-spacing:2px;color:#eee}
.subtitle{margin:8px 0 0;color:#999;font-size:14px}
main{max-width:1100px;margin:auto;padding:22px 16px}
#viewOnly{border:1px solid #555;border-radius:14px;padding:24px 16px;text-align:center;background:#111;margin-bottom:18px}
#viewOnly strong{display:block;font-size:17px;letter-spacing:1px;margin-bottom:7px}
#viewOnly span{color:#999;font-size:13px}
#status{margin:14px 0;text-align:center;color:#aaa;min-height:20px;font-size:13px;word-break:break-word}
.grid{columns:4 220px;column-gap:12px}
.card{break-inside:avoid;margin:0 0 12px;position:relative;background:#151515;border-radius:10px;overflow:hidden;border:1px solid #292929}
.card img{display:block;width:100%;height:auto;cursor:pointer}
.download{position:absolute;left:8px;top:8px;border:1px solid #777;background:rgba(0,0,0,.75);color:#fff;border-radius:7px;padding:7px 9px;cursor:pointer;text-decoration:none;font-size:13px}.download:hover{background:#222}
.empty{text-align:center;color:#777;padding:40px 10px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
.close{position:absolute;right:18px;top:12px;font-size:34px;color:#fff;cursor:pointer}
@media(max-width:650px){h1{font-size:27px}.grid{columns:2 150px}}
</style>
</head>
<body>
<header>
  <h1>PHOTO WALL</h1>
  <div class="subtitle">View and download photos from the Photo Wall. Anyone with this link can access the gallery.</div>
</header>

<main>
  <div id="viewOnly">
    <strong>VIEW & DOWNLOAD ONLY</strong>
    <span>Tap a photo to view it. Use the Download button to save it.</span>
  </div>
<div id="status">Connecting to Photo Wall...</div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No photos yet. Be the first to add one.</div>
</main>

<div id="lightbox" class="lightbox">
  <div class="close" id="close">&times;</div>
  <img id="lightboxImg" alt="">
</div>

<script>
const SUPABASE_URL = 'https://wykfkkleyhrdeimkirxv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h-O7O9zu3i9PyXY99g1H5g_9gDIKTA2';

const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');

let supabaseClient = null;

function say(message){
  statusEl.textContent = message;
}

try {
  if (!window.supabase || !window.supabase.createClient) {
    throw new Error('Supabase JavaScript library did not load.');
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(err) {
  console.error(err);
  say('SUPABASE INIT ERROR: ' + (err.message || err));
}

function showError(prefix, err){
  console.error(prefix, err);
  const parts = [
    err?.code,
    err?.message || String(err),
    err?.details,
    err?.hint
  ].filter(Boolean);
  say(prefix + ': ' + parts.join(' | '));
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

async function loadPhotos(){
  if(!supabaseClient) return;

  const {data, error} = await supabaseClient
    .from('photos')
    .select('id,data,name,created_at')
    .order('created_at', {ascending:false});

  if(error){
    showError('LOAD ERROR', error);
    return;
  }

  grid.innerHTML = '';

  if(!data || data.length === 0){
    empty.style.display = 'block';
    say('Connected. No photos yet.');
    return;
  }

  empty.style.display = 'none';
  say(data.length + (data.length === 1 ? ' photo' : ' photos') + ' loaded.');

  for(const photo of data){
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = photo.data;
    img.alt = photo.name || 'Photo';
    img.loading = 'lazy';

    img.addEventListener('click', () => {
      document.getElementById('lightboxImg').src = photo.data;
      document.getElementById('lightbox').classList.add('open');
    });

    const download = document.createElement('a');
    download.className = 'download';
    download.textContent = 'Download';
    download.href = photo.data;
    download.download = photo.name || 'photo.jpg';
    download.addEventListener('click', e => e.stopPropagation());

    card.appendChild(img);
    card.appendChild(download);
    grid.appendChild(card);
  }
}







document.getElementById('close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') e.currentTarget.classList.remove('open');
});

loadPhotos();
setInterval(loadPhotos, 5000);
</script>
</body>
</html>
