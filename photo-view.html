<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,Helvetica,sans-serif;transition:background .25s,color .25s}
body.light{background:#f5f5f5;color:#171717}
.logo{position:relative;padding:18px 12px;text-align:center;border-bottom:1px solid #333;background:#080808;transition:background .25s,border-color .25s}
body.light .logo{background:#fff;border-color:#ddd}
.logo-text{color:#eee;font-size:22px;font-weight:700;letter-spacing:3px}
body.light .logo-text{color:#171717}
.logo-subtitle{margin-top:6px;color:#999;font-size:13px}
.theme-toggle{position:absolute;right:14px;top:14px;border:1px solid #666;background:#111;color:#eee;border-radius:999px;padding:7px 11px;cursor:pointer;font-size:14px;flex:initial}
body.light .theme-toggle{background:#fff;color:#171717;border-color:#bbb}
main{max-width:1100px;margin:auto;padding:22px 16px}
.grid{columns:4 220px;column-gap:12px}
.card{break-inside:avoid;margin:0 0 12px;background:#151515;border-radius:10px;overflow:hidden;border:1px solid #292929;transition:background .25s,border-color .25s}
body.light .card{background:#fff;border-color:#ddd}
.card img{display:block;width:100%;height:auto;cursor:pointer}
.empty{text-align:center;color:#777;padding:40px 10px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
.close{position:absolute;right:18px;top:12px;font-size:34px;color:#fff;cursor:pointer}
@media(max-width:650px){.grid{columns:2 150px}}
</style>
</head>
<body>

<header class="logo">
  <div class="logo-text">PHOTO VIEW</div>
  <div class="logo-subtitle">View</div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark theme">☀️ Light</button>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No photos yet.</div>
</main>

<div id="lightbox" class="lightbox">
  <div class="close" id="close">&times;</div>
  <img id="lightboxImg" alt="">
</div>

<script>
const SUPABASE_URL = 'https://wykfkkleyhrdeimkirxv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h-O7O9zu3i9PyXY99g1H5g_9gDIKTA2';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  themeToggle.textContent = theme === 'light' ? '🌙 Dark' : '☀️ Light';
  localStorage.setItem('photoViewTheme', theme);
}

const savedTheme = localStorage.getItem('photoViewTheme') || 'dark';
applyTheme(savedTheme);

themeToggle.addEventListener('click',()=>{
  applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
});

async function loadPhotos(){
  const {data,error} = await supabaseClient
    .from('photos')
    .select('id,data,name,created_at')
    .order('created_at',{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  grid.innerHTML = '';

  if(!data || data.length === 0){
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  for(const photo of data){
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = photo.data;
    img.alt = photo.name || 'Photo';
    img.loading = 'lazy';

    img.addEventListener('click',()=>{
      document.getElementById('lightboxImg').src = photo.data;
      document.getElementById('lightbox').classList.add('open');
    });

    card.appendChild(img);
    grid.appendChild(card);
  }
}

document.getElementById('close').addEventListener('click',()=>{
  document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('lightbox').addEventListener('click',e=>{
  if(e.target.id === 'lightbox') e.currentTarget.classList.remove('open');
});

loadPhotos();
setInterval(loadPhotos,5000);
</script>
</body>
</html>
