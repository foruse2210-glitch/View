<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>christian brothers photos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000000;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

header {
  padding: 40px 20px 24px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: #ffffff;
}

.subtitle {
  margin: 6px 0 0;
  color: #86868b;
  font-size: 15px;
  font-weight: 400;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 16px;
}

/* Upload Drop Area - Rounded Glass Container */
#drop {
  display: block;
  border-radius: 20px;
  padding: 42px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

#drop:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.45);
}

#drop strong {
  display: block;
  font-size: 20px;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 6px;
}

#drop span {
  color: #86868b;
  font-size: 14px;
}

#file {
  display: none;
}

#status {
  margin: 18px 0;
  text-align: center;
  color: #86868b;
  min-height: 20px;
  font-size: 14px;
  font-weight: 400;
  word-break: break-word;
}

/* Liquid Floating Toolbar */
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
}

.toolbar-left {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* Base Rounded Glass Button */
.btn-round {
  height: 44px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
  outline: none !important;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.45);
  transform: translateY(-2px);
}

.btn-round:active {
  transform: scale(0.96) !important;
}

.btn-icon-only {
  width: 44px;
}

/* Keyframe Animations for Password Gear Icon */
@keyframes gearSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(10, 132, 255, 0.3); }
  50% { box-shadow: 0 0 22px rgba(10, 132, 255, 0.7); }
  100% { box-shadow: 0 0 10px rgba(10, 132, 255, 0.3); }
}

/* Enhanced Change Password Button */
.btn-password-change {
  padding: 0 18px 0 14px;
  gap: 8px;
  color: #ffffff;
  font-size: 14px;
  font-weight: 500;
  background: linear-gradient(135deg, rgba(10, 132, 255, 0.25), rgba(0, 113, 227, 0.15));
  border: 1px solid rgba(10, 132, 255, 0.4);
  animation: pulseGlow 3s infinite ease-in-out;
}

.btn-password-change:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(10, 132, 255, 0.45), rgba(0, 113, 227, 0.35));
  border-color: rgba(10, 132, 255, 0.7);
  box-shadow: 0 0 20px rgba(10, 132, 255, 0.5);
}

.btn-password-change svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-password-change:hover svg {
  animation: gearSpin 1.8s linear infinite;
}

/* Select Button */
.btn-round-select {
  color: #ffffff;
}

.btn-round-select.active {
  background: rgba(0, 113, 227, 0.9);
  border-color: rgba(255, 255, 255, 0.5);
  color: #ffffff;
  box-shadow: 0 0 20px rgba(0, 113, 227, 0.6) !important;
}

.btn-round-select svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round-select.active svg {
  transform: rotate(360deg);
}

/* Delete Button */
.btn-round-delete {
  color: #ff453a;
  background: rgba(255, 69, 58, 0.12);
  border-color: rgba(255, 69, 58, 0.3);
}

.btn-round-delete:hover:not(:disabled) {
  background: rgba(255, 69, 58, 0.25);
  border-color: rgba(255, 69, 58, 0.5);
  box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
}

.btn-round-delete:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.btn-round-delete svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Shake Animation */
@keyframes shakeTrash {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(-10deg); }
  40% { transform: rotate(10deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}

.btn-round-delete.deleting {
  animation: shakeTrash 0.5s ease-in-out infinite;
  background: rgba(255, 69, 58, 0.9) !important;
  color: #fff !important;
}

/* Masonry Grid & Cards */
.grid {
  columns: 4 220px;
  column-gap: 18px;
}

.card {
  break-inside: avoid;
  margin: 0 0 18px;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
  cursor: pointer;
  user-select: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.35);
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  transition: opacity 0.3s ease;
}

.card.selected {
  border-color: #0a84ff;
  box-shadow: 0 0 0 2px #0a84ff, 0 12px 36px rgba(10, 132, 255, 0.45);
}

.card.deleting-card {
  opacity: 0;
  transform: scale(0.9);
}

/* Custom Checkbox Overlay */
.select-box {
  display: none;
  position: absolute;
  top: 12px;
  left: 12px;
  width: 22px;
  height: 22px;
  z-index: 5;
  cursor: pointer;
  accent-color: #0a84ff;
  outline: none;
  border-radius: 4px;
}

.selecting .select-box {
  display: block;
}

.empty {
  text-align: center;
  color: #86868b;
  padding: 60px 10px;
  font-size: 15px;
}

/* Lightbox Glass Overlay */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 92vw;
  max-height: 88vh;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.close {
  position: absolute;
  right: 24px;
  top: 20px;
  font-size: 28px;
  color: #ffffff;
  cursor: pointer;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  transition: all 0.2s ease;
}

.close:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* Glass Modals */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  z-index: 105;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: rgba(30, 30, 32, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
}

.modal-content h3 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  color: #ffffff;
}

.modal-content p {
  margin: 0 0 20px;
  font-size: 14px;
  color: #86868b;
}

/* Input Wrappers with Password Toggle Eye Button */
.input-field-group {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

.input-field-group input {
  width: 100%;
  padding: 12px 42px 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(0, 0, 0, 0.5);
  color: #ffffff;
  font-size: 16px;
  outline: none;
  text-align: left;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-field-group input:focus {
  border-color: #0a84ff;
  box-shadow: 0 0 10px rgba(10, 132, 255, 0.3);
}

.toggle-eye-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #86868b;
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: color 0.2s ease;
}

.toggle-eye-btn:hover {
  color: #ffffff;
}

.toggle-eye-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.modal-btn-cancel {
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.modal-btn-cancel:hover {
  background: rgba(255, 255, 255, 0.2);
}

.modal-btn-confirm {
  background: #ff453a;
  color: #ffffff;
}

.modal-btn-confirm:hover {
  background: #ff6961;
}

.modal-btn-primary {
  background: #0a84ff;
  color: #ffffff;
}

.modal-btn-primary:hover {
  background: #0071e3;
}

@media(max-width: 650px) {
  h1 { font-size: 28px; }
  .grid { columns: 2 150px; }
  .btn-password-change span { display: none; }
  .btn-password-change { padding: 0 12px; }
}
</style>
</head>
<body>
<header>
  <h1>christian brothers</h1>
  <div class="subtitle">Christian brothers photos will be uploaded in this.</div>
</header>

<main>
  <label id="drop" for="file" tabindex="0">
    <strong>Upload image</strong>
    <span>photo ivide upload aakuka!</span>
    <input id="file" type="file" accept="image/*">
  </label>

  <div id="status">wait aakk photo ippo varum... </div>

  <!-- Action Bar for Selection & Deletion -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="toggleSelectBtn" class="btn-round btn-icon-only btn-round-select" type="button" title="Select Photos">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </button>
      <button id="changePasswordBtn" class="btn-round btn-password-change" type="button" title="Change Password">
        <svg viewBox="0 0 24 24">
          <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v2h2v-2h2v-2H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
        <span>Change Password</span>
      </button>

    <button id="deleteSelectedBtn" class="btn-round btn-icon-only btn-round-delete" type="button" style="display:none;" title="Delete Selected" disabled>
      <svg viewBox="0 0 24 24">
        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>

</main>

<div id="lightbox" class="lightbox">
  <div class="close" id="close">&times;</div>
  <img id="lightboxImg" alt="">
</div>

<!-- Password Confirmation Modal for Deletion -->
<div id="passwordModal" class="modal">
  <div class="modal-content">
    <h3>Enter Security Password</h3>
    <p>Password is required to delete photos.</p>
    <div class="input-field-group">
      <input type="password" id="deletePasswordInput" placeholder="Password" autocomplete="off">
      <button type="button" class="toggle-eye-btn" data-target="deletePasswordInput" title="Toggle password visibility">
        <svg class="icon-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="cancelDeleteBtn">Cancel</button>
      <button class="modal-btn modal-btn-confirm" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div id="changePasswordModal" class="modal">
  <div class="modal-content">
    <h3>Change Password</h3>
    <p>Enter current password and new password.</p>
    
    <div class="input-field-group">
      <input type="password" id="currentPassInput" placeholder="Current Password" autocomplete="off">
      <button type="button" class="toggle-eye-btn" data-target="currentPassInput" title="Toggle password visibility">
        <svg class="icon-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
    </div>

    <div class="input-field-group">
      <input type="password" id="newPassInput" placeholder="New Password" autocomplete="off">
      <button type="button" class="toggle-eye-btn" data-target="newPassInput" title="Toggle password visibility">
        <svg class="icon-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
    </div>

    <div class="input-field-group">
      <input type="password" id="confirmPassInput" placeholder="Confirm New Password" autocomplete="off">
      <button type="button" class="toggle-eye-btn" data-target="confirmPassInput" title="Toggle password visibility">
        <svg class="icon-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
    </div>

    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="cancelChangePassBtn">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="savePasswordBtn">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rzwxjoopiatggbwcyqbz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_whZ77dZpRIP5Tobol-pSdA_iYyFiQst';

// SVG Paths for Eye Icons
const EYE_OPEN_PATH = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
const EYE_CLOSED_PATH = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>';

// Load saved password from localStorage, or use default '123'
let currentPassword = localStorage.getItem('app_delete_password') || '123';

const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const fileIn = document.getElementById('file');
const drop = document.getElementById('drop');

const toggleSelectBtn = document.getElementById('toggleSelectBtn');
const changePasswordBtn = document.getElementById('changePasswordBtn');
const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

// Delete Password Modal Elements
const passwordModal = document.getElementById('passwordModal');
const deletePasswordInput = document.getElementById('deletePasswordInput');
const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

// Change Password Modal Elements
const changePasswordModal = document.getElementById('changePasswordModal');
const currentPassInput = document.getElementById('currentPassInput');
const newPassInput = document.getElementById('newPassInput');
const confirmPassInput = document.getElementById('confirmPassInput');
const cancelChangePassBtn = document.getElementById('cancelChangePassBtn');
const savePasswordBtn = document.getElementById('savePasswordBtn');

let supabaseClient = null;
let isSelectMode = false;
let selectedPhotoIds = new Set();
let currentPhotos = [];

function say(message){
  statusEl.textContent = message;
}

try {
  if (!window.supabase || !window.supabase.createClient) {
    throw new Error('Supabase JavaScript library did not load.');
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(err) {
  console.error(err);
  say('SUPABASE INIT ERROR: ' + (err.message || err));
}

function showError(prefix, err){
  console.error(prefix, err);
  const parts = [
    err?.code,
    err?.message || String(err),
    err?.details,
    err?.hint
  ].filter(Boolean);
  say(prefix + ': ' + parts.join(' | '));
}

// Attach toggle password visibility functionality
document.querySelectorAll('.toggle-eye-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.getAttribute('data-target');
    const input = document.getElementById(targetId);
    const svg = btn.querySelector('svg');
    if (input.type === 'password') {
      input.type = 'text';
      svg.innerHTML = EYE_CLOSED_PATH;
    } else {
      input.type = 'password';
      svg.innerHTML = EYE_OPEN_PATH;
    }
  });
});

async function loadPhotos(){
  if(!supabaseClient) return;

  const {data, error} = await supabaseClient
    .from('photos')
    .select('id,data,name,created_at')
    .order('created_at', {ascending:false});

  if(error){
    showError('LOAD ERROR', error);
    return;
  }

  currentPhotos = data || [];
  renderGrid();
}

function renderGrid(){
  grid.innerHTML = '';

  if(!currentPhotos || currentPhotos.length === 0){
    empty.style.display = 'block';
    toggleSelectBtn.style.display = 'none';
    deleteSelectedBtn.style.display = 'none';
    say('Connected. No photos yet.');
    return;
  }

  empty.style.display = 'none';
  toggleSelectBtn.style.display = 'inline-flex';
  say(currentPhotos.length + (currentPhotos.length === 1 ? ' photo' : ' photos') + ' loaded.');

  if(isSelectMode){
    grid.classList.add('selecting');
    deleteSelectedBtn.style.display = 'inline-flex';
    toggleSelectBtn.classList.add('active');
    toggleSelectBtn.title = 'Cancel Selection';
  } else {
    grid.classList.remove('selecting');
    deleteSelectedBtn.style.display = 'none';
    toggleSelectBtn.classList.remove('active');
    toggleSelectBtn.title = 'Select Photos';
  }

  for(const photo of currentPhotos){
    const card = document.createElement('div');
    card.className = 'card' + (selectedPhotoIds.has(photo.id) ? ' selected' : '');
    card.dataset.id = photo.id;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'select-box';
    checkbox.checked = selectedPhotoIds.has(photo.id);

    const img = document.createElement('img');
    img.src = photo.data;
    img.alt = photo.name || 'Photo';
    img.loading = 'lazy';

    const toggleSelection = (e) => {
      e.stopPropagation();
      if(selectedPhotoIds.has(photo.id)){
        selectedPhotoIds.delete(photo.id);
        card.classList.remove('selected');
        checkbox.checked = false;
      } else {
        selectedPhotoIds.add(photo.id);
        card.classList.add('selected');
        checkbox.checked = true;
      }
      updateDeleteButton();
    };

    checkbox.addEventListener('click', (e) => {
      e.stopPropagation();
      if(checkbox.checked){
        selectedPhotoIds.add(photo.id);
        card.classList.add('selected');
      } else {
        selectedPhotoIds.delete(photo.id);
        card.classList.remove('selected');
      }
      updateDeleteButton();
    });

    card.addEventListener('click', (e) => {
      if(isSelectMode){
        toggleSelection(e);
      } else {
        document.getElementById('lightboxImg').src = photo.data;
        document.getElementById('lightbox').classList.add('open');
      }
    });

    card.appendChild(checkbox);
    card.appendChild(img);
    grid.appendChild(card);
  }

  updateDeleteButton();
}

function updateDeleteButton(){
  const count = selectedPhotoIds.size;
  deleteSelectedBtn.title = `Delete ${count} selected photo(s)`;
  deleteSelectedBtn.disabled = count === 0;
}

toggleSelectBtn.addEventListener('click', () => {
  isSelectMode = !isSelectMode;
  if(!isSelectMode){
    selectedPhotoIds.clear();
  }
  renderGrid();
});

/* Open Password Modal for Delete */
deleteSelectedBtn.addEventListener('click', () => {
  if(selectedPhotoIds.size === 0) return;
  deletePasswordInput.value = '';
  passwordModal.classList.add('open');
  deletePasswordInput.focus();
});

cancelDeleteBtn.addEventListener('click', () => {
  passwordModal.classList.remove('open');
});

deletePasswordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    confirmDeleteBtn.click();
  }
});

/* Process Deletion after Password Check */
confirmDeleteBtn.addEventListener('click', async () => {
  const enteredPassword = deletePasswordInput.value;
  if (enteredPassword !== currentPassword) {
    alert('Incorrect password! Deletion canceled.');
    deletePasswordInput.value = '';
    deletePasswordInput.focus();
    return;
  }

  passwordModal.classList.remove('open');

  deleteSelectedBtn.classList.add('deleting');
  deleteSelectedBtn.disabled = true;

  const idsToDelete = Array.from(selectedPhotoIds);

  idsToDelete.forEach(id => {
    const cardEl = grid.querySelector(`.card[data-id="${id}"]`);
    if(cardEl) cardEl.classList.add('deleting-card');
  });

  say('Deleting selected photos...');

  const {error} = await supabaseClient
    .from('photos')
    .delete()
    .in('id', idsToDelete);

  setTimeout(async () => {
    deleteSelectedBtn.classList.remove('deleting');
    if(error){
      showError('DELETE ERROR', error);
      updateDeleteButton();
      return;
    }

    selectedPhotoIds.clear();
    isSelectMode = false;
    await loadPhotos();
  }, 400);
});

/* Open Change Password Modal */
changePasswordBtn.addEventListener('click', () => {
  currentPassInput.value = '';
  newPassInput.value = '';
  confirmPassInput.value = '';
  changePasswordModal.classList.add('open');
  currentPassInput.focus();
});

cancelChangePassBtn.addEventListener('click', () => {
  changePasswordModal.classList.remove('open');
});

savePasswordBtn.addEventListener('click', () => {
  const currentVal = currentPassInput.value;
  const newVal = newPassInput.value;
  const confirmVal = confirmPassInput.value;

  if (currentVal !== currentPassword) {
    alert('Current password is incorrect.');
    currentPassInput.focus();
    return;
  }

  if (!newVal) {
    alert('Please enter a new password.');
    newPassInput.focus();
    return;
  }

  if (newVal !== confirmVal) {
    alert('New passwords do not match.');
    confirmPassInput.focus();
    return;
  }

  currentPassword = newVal;
  localStorage.setItem('app_delete_password', newVal);
  alert('Password updated successfully!');
  changePasswordModal.classList.remove('open');
});

function resizeImage(file, maxSize=1600, quality=.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          const scale = Math.min(maxSize/w, maxSize/h);
          w = Math.round(w*scale);
          h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read the image.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read the selected file.'));
    reader.readAsDataURL(file);
  });
}

async function addPhoto(file){
  if(!supabaseClient){
    say('Supabase is not initialized.');
    return;
  }

  if(!file || !file.type.startsWith('image/')){
    say('Please select an image.');
    return;
  }

  try{
    say('Uploading...');
    const data = await resizeImage(file);

    const {error} = await supabaseClient
      .from('photos')
      .insert({
        data:data,
        name:file.name
      });

    if(error){
      showError('UPLOAD ERROR', error);
      return;
    }

    say('Uploaded successfully.');
    await loadPhotos();
  }catch(err){
    showError('UPLOAD ERROR', err);
  }
}

fileIn.addEventListener('change', () => {
  const file = fileIn.files && fileIn.files[0];
  if(file) addPhoto(file);
  fileIn.value = '';
});

drop.addEventListener('dragover', e => {
  e.preventDefault();
  drop.style.borderColor = '#fff';
});

drop.addEventListener('dragleave', () => {
  drop.style.borderColor = '';
});

drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.style.borderColor = '';
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if(file) addPhoto(file);
});

document.getElementById('close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') e.currentTarget.classList.remove('open');
});

loadPhotos();
setInterval(loadPhotos, 5000);
</script>
</body>
