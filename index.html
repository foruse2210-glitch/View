<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos Base</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://wykfkkleyhrdeimkirxv.supabase.co" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  box-sizing: border-box;
}

:root {
  --accent: #0a84ff;
  --accent-rgb: 10, 132, 255;
  --accent2: #0071e3;
  --accent2-rgb: 0, 113, 227;
}

:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-rgb: 0, 0, 0;
  --fg-rgb: 255, 255, 255;
  --text: #ffffff;
  --muted: #86868b;
  --modal-bg: rgba(30, 30, 32, 0.85);
  --shadow-k: 1;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f7;
  --bg-rgb: 255, 255, 255;
  --fg-rgb: 0, 0, 0;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --modal-bg: rgba(255, 255, 255, 0.92);
  --shadow-k: 0.18;
}

:root[data-theme="midnight"] {
  color-scheme: dark;
  --bg: #0a1128;
  --bg-rgb: 10, 17, 40;
  --fg-rgb: 255, 255, 255;
  --text: #eaf0ff;
  --muted: #8a96b8;
  --modal-bg: rgba(18, 28, 60, 0.9);
  --shadow-k: 1;
}

:root[data-theme="warm"] {
  color-scheme: dark;
  --bg: #1a1410;
  --bg-rgb: 26, 20, 16;
  --fg-rgb: 255, 244, 230;
  --text: #f5ece0;
  --muted: #a39682;
  --modal-bg: rgba(44, 34, 27, 0.92);
  --shadow-k: 1;
}


:root[data-theme="ocean"] { color-scheme: dark; --bg:#06181f; --bg-rgb:6,24,31; --fg-rgb:230,250,255; --text:#e3f6fb; --muted:#7fa3ad; --modal-bg:rgba(10,36,46,0.92); --shadow-k:1; }
:root[data-theme="forest"] { color-scheme: dark; --bg:#0a1a12; --bg-rgb:10,26,18; --fg-rgb:235,255,240; --text:#e6f6ea; --muted:#7fa38c; --modal-bg:rgba(18,40,28,0.92); --shadow-k:1; }
:root[data-theme="rose"] { color-scheme: dark; --bg:#1c0f17; --bg-rgb:28,15,23; --fg-rgb:255,235,244; --text:#f8e8ef; --muted:#a68a99; --modal-bg:rgba(44,24,36,0.92); --shadow-k:1; }
:root[data-theme="paper"] { color-scheme: light; --bg:#f6f1e7; --bg-rgb:255,250,240; --fg-rgb:40,30,20; --text:#2b2118; --muted:#7a6d5e; --modal-bg:rgba(255,252,245,0.94); --shadow-k:0.18; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  padding: 40px 20px 24px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(var(--bg-rgb), 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(var(--fg-rgb), 0.15);
}

h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}

.subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
  font-weight: 400;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 16px;
}

/* Upload Drop Area - Rounded Glass Container */
#drop {
  display: block;
  border-radius: 20px;
  padding: 42px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  background:
    linear-gradient(
      135deg,
      rgba(var(--accent-rgb), 0.14),
      rgba(var(--accent2-rgb), 0.06)
    ),
    rgba(var(--fg-rgb), 0.03);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border: 1px solid rgba(var(--accent-rgb), 0.55);
  box-shadow:
    inset 0 1px 1px rgba(var(--fg-rgb), 0.2),
    0 0 12px rgba(var(--accent-rgb), 0.35),
    0 0 30px rgba(var(--accent-rgb), 0.18);
  animation: uploadGlow 2.4s ease-in-out infinite;
}

#drop:hover {
  background:
    linear-gradient(
      135deg,
      rgba(var(--accent-rgb), 0.22),
      rgba(var(--accent2-rgb), 0.12)
    ),
    rgba(var(--fg-rgb), 0.08);
  border-color: rgba(var(--accent-rgb), 0.85);
  box-shadow:
    inset 0 1px 1px rgba(var(--fg-rgb), 0.25),
    0 0 18px rgba(var(--accent-rgb), 0.55),
    0 0 42px rgba(var(--accent-rgb), 0.28);
}

@keyframes uploadGlow {
  0%, 100% {
    border-color: rgba(var(--accent-rgb), 0.45);
    box-shadow:
      inset 0 1px 1px rgba(var(--fg-rgb), 0.2),
      0 0 10px rgba(var(--accent-rgb), 0.28),
      0 0 24px rgba(var(--accent-rgb), 0.14);
  }
  50% {
    border-color: rgba(var(--accent-rgb), 0.9);
    box-shadow:
      inset 0 1px 1px rgba(var(--fg-rgb), 0.25),
      0 0 20px rgba(var(--accent-rgb), 0.62),
      0 0 44px rgba(var(--accent-rgb), 0.28);
  }
}

#drop strong {
  display: block;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

#drop span {
  color: var(--muted);
  font-size: 14px;
}

#file {
  display: none;
}

/* Download protection (toggled from the admin dashboard) */
.no-download img {
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
}

.no-download .card img {
  pointer-events: none;
}

@media print {
  .no-download body { display: none !important; }
}


/* Accent glow for the photo selection control */
#drop input[type="file"] {
  color: var(--fg);
  accent-color: var(--accent);
}

#drop input[type="file"]::file-selector-button {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid rgba(var(--accent-rgb), 0.75);
  border-radius: 12px;
  padding: 11px 18px;
  margin-right: 10px;
  color: var(--fg);
  background:
    linear-gradient(
      135deg,
      rgba(var(--accent-rgb), 0.24),
      rgba(var(--accent2-rgb), 0.12)
    );
  box-shadow:
    0 0 10px rgba(var(--accent-rgb), 0.35),
    0 0 24px rgba(var(--accent-rgb), 0.16);
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  transition: transform 0.2s ease, border-color 0.2s ease,
              box-shadow 0.2s ease, background 0.2s ease;
  animation: selectionGlow 2.4s ease-in-out infinite;
}

#drop input[type="file"]::file-selector-button:hover {
  border-color: rgba(var(--accent-rgb), 1);
  background:
    linear-gradient(
      135deg,
      rgba(var(--accent-rgb), 0.34),
      rgba(var(--accent2-rgb), 0.18)
    );
  transform: translateY(-1px);
  box-shadow:
    0 0 18px rgba(var(--accent-rgb), 0.65),
    0 0 38px rgba(var(--accent-rgb), 0.28);
}

@keyframes selectionGlow {
  0%, 100% {
    border-color: rgba(var(--accent-rgb), 0.55);
    box-shadow:
      0 0 9px rgba(var(--accent-rgb), 0.28),
      0 0 20px rgba(var(--accent-rgb), 0.12);
  }
  50% {
    border-color: rgba(var(--accent-rgb), 0.95);
    box-shadow:
      0 0 18px rgba(var(--accent-rgb), 0.58),
      0 0 34px rgba(var(--accent-rgb), 0.24);
  }
}

#drop.paused input[type="file"]::file-selector-button {
  animation: none;
  cursor: not-allowed;
  box-shadow: none;
  opacity: 0.65;
}

#drop.paused {
  opacity: 0.55;
  cursor: not-allowed;
  border-style: dashed;
  animation: none;
  box-shadow: inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
}

#drop.paused:hover {
  background: rgba(var(--fg-rgb), 0.03);
  border-color: rgba(var(--fg-rgb), 0.2);
}

/* Progress Bar Styling */
.progress-container {
  display: none;
  width: 100%;
  max-width: 400px;
  height: 8px;
  background: rgba(var(--fg-rgb), 0.1);
  border-radius: 10px;
  margin: 18px auto 8px auto;
  overflow: hidden;
  border: 1px solid rgba(var(--fg-rgb), 0.15);
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 10px;
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.6);
}

#status {
  margin: 8px 0 18px 0;
  text-align: center;
  color: var(--muted);
  min-height: 20px;
  font-size: 14px;
  font-weight: 400;
  word-break: break-word;
}

/* Sticky Liquid Floating Toolbar */
.toolbar {
  position: sticky;
  top: 100px;
  z-index: 20;
  background: rgba(var(--bg-rgb), 0.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid rgba(var(--fg-rgb), 0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, calc(0.5 * var(--shadow-k)));
}

.toolbar-left {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* Selected Counter Badge */
.selected-count {
  display: none;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.15);
  border: 1px solid rgba(var(--accent-rgb), 0.3);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}

/* Base Rounded Glass Button */
.btn-round {
  height: 44px;
  border-radius: 22px;
  background: rgba(var(--fg-rgb), 0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  box-shadow: inset 0 1px 1px rgba(var(--fg-rgb), 0.25);
  outline: none !important;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round:hover:not(:disabled) {
  background: rgba(var(--fg-rgb), 0.15);
  border-color: rgba(var(--fg-rgb), 0.45);
  transform: translateY(-2px);
}

.btn-round:active {
  transform: scale(0.96) !important;
}

.btn-icon-only {
  width: 44px;
}

/* Keyframe Animations for Password Gear Icon */
@keyframes gearSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3); }
  50% { box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.7); }
  100% { box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3); }
}

/* Enhanced Change Password Button */
.btn-password-change {
  padding: 0 18px 0 14px;
  gap: 8px;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.25), rgba(var(--accent2-rgb), 0.15));
  border: 1px solid rgba(var(--accent-rgb), 0.4);
  animation: pulseGlow 3s infinite ease-in-out;
}

.btn-password-change:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.45), rgba(var(--accent2-rgb), 0.35));
  border-color: rgba(var(--accent-rgb), 0.7);
  box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5);
}

.btn-password-change svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-password-change:hover svg {
  animation: gearSpin 1.8s linear infinite;
}

/* Select Button */
@keyframes selectButtonGlow {
  0%, 100% {
    border-color: rgba(var(--accent-rgb), 0.55);
    box-shadow:
      inset 0 1px 1px rgba(var(--fg-rgb), 0.25),
      0 0 10px rgba(var(--accent-rgb), 0.32),
      0 0 24px rgba(var(--accent-rgb), 0.14);
  }
  50% {
    border-color: rgba(var(--accent-rgb), 0.95);
    box-shadow:
      inset 0 1px 1px rgba(var(--fg-rgb), 0.3),
      0 0 20px rgba(var(--accent-rgb), 0.7),
      0 0 42px rgba(var(--accent-rgb), 0.3);
  }
}

.btn-round-select {
  color: var(--text);
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.16), rgba(var(--accent2-rgb), 0.08));
  border-color: rgba(var(--accent-rgb), 0.55);
  animation: selectButtonGlow 2.4s ease-in-out infinite;
}

.btn-round-select.active {
  /* Keep the same normal appearance while selecting; do not create an inner/focus glow. */
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.16), rgba(var(--accent2-rgb), 0.08));
  border-color: rgba(var(--accent-rgb), 0.55);
  color: var(--text);
  animation: selectButtonGlow 2.4s ease-in-out infinite;
  box-shadow:
    inset 0 1px 1px rgba(var(--fg-rgb), 0.25),
    0 0 10px rgba(var(--accent-rgb), 0.32),
    0 0 24px rgba(var(--accent-rgb), 0.14);
}

.btn-round-select:focus,
.btn-round-select:focus-visible,
.btn-round-select:active,
.btn-round-select.active:focus,
.btn-round-select.active:focus-visible {
  outline: none !important;
  -webkit-tap-highlight-color: transparent;
}

.btn-round-select.active svg {
  filter: none;
}

.btn-round-select svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round-select.active svg {
  transform: rotate(360deg);
}

/* Delete Button */
.btn-round-delete {
  color: #ff453a;
  background: rgba(255, 69, 58, 0.12);
  border-color: rgba(255, 69, 58, 0.3);
}

.btn-round-delete:hover:not(:disabled) {
  background: rgba(255, 69, 58, 0.25);
  border-color: rgba(255, 69, 58, 0.5);
  box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
}

.btn-round-delete:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.btn-round-delete svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Shake Animation */
@keyframes shakeTrash {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(-10deg); }
  40% { transform: rotate(10deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}

.btn-round-delete.deleting {
  animation: shakeTrash 0.5s ease-in-out infinite;
  background: rgba(255, 69, 58, 0.9) !important;
  color: #fff !important;
}

/* Masonry Grid & Cards */
.grid {
  columns: 4 220px;
  column-gap: 18px;
}

.card {
  break-inside: avoid;
  margin: 0 0 18px;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(var(--fg-rgb), 0.04);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.18);
  box-shadow: 0 10px 30px rgba(0, 0, 0, calc(0.8 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
  cursor: pointer;
  user-select: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(var(--fg-rgb), 0.4);
  box-shadow: 0 16px 40px rgba(0, 0, 0, calc(0.9 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.35);
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  transition: opacity 0.3s ease;
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 12px 36px rgba(var(--accent-rgb), 0.45);
}

.card.deleting-card {
  opacity: 0;
  transform: scale(0.9);
}

/* Custom Checkbox Overlay */
.select-box {
  display: none;
  position: absolute;
  top: 12px;
  left: 12px;
  width: 22px;
  height: 22px;
  z-index: 5;
  cursor: pointer;
  accent-color: var(--accent);
  outline: none;
  border-radius: 4px;
}

.selecting .select-box {
  display: block;
}

/* In select mode, photos you can't select are dimmed */
.selecting .card.not-mine {
  cursor: not-allowed;
}
.selecting .card.not-mine img {
  opacity: 0.45;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 10px;
  font-size: 15px;
}

/* Lightbox Glass Overlay & Navigation Arrows */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 88vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.close {
  position: absolute;
  right: 24px;
  top: 20px;
  font-size: 28px;
  color: #ffffff;
  cursor: pointer;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  transition: all 0.2s ease;
  z-index: 102;
}

.close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.2s ease;
  z-index: 101;
  user-select: none;
}

.lightbox-arrow:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-50%) scale(1.08);
}

.lightbox-arrow svg {
  width: 28px;
  height: 28px;
  fill: currentColor;
}

.lightbox-prev {
  left: 20px;
}

.lightbox-next {
  right: 20px;
}

/* Glass Modals */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(var(--bg-rgb), 0.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  z-index: 105;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: var(--modal-bg);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, calc(0.8 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
}

.modal-content h3 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
}

.modal-content p {
  margin: 0 0 20px;
  font-size: 14px;
  color: var(--muted);
}

/* Input Wrappers with Password Toggle Eye Button */
.input-field-group {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

.input-field-group input {
  width: 100%;
  padding: 12px 42px 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  background: rgba(var(--bg-rgb), 0.5);
  color: var(--text);
  font-size: 16px;
  outline: none;
  text-align: left;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-field-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3);
}

.toggle-eye-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);

    {name:'Lime',   hex:'#a3e635'}
  ];
  var DEFAULTS = {theme:'dark', accent:'#0a84ff'};
  function read(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } }
  function write(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function hexToRgb(h){
    h = String(h).replace('#','');
    if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
    var n = parseInt(h, 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function get(){
    var t = read('app_theme', DEFAULTS.theme);
    var a = read('app_accent', DEFAULTS.accent);
    if (!THEMES[t]) t = DEFAULTS.theme;
    if (!/^#[0-9a-fA-F]{6}$/.test(a)) a = DEFAULTS.accent;
    return {theme:t, accent:a};
  }
  function apply(theme, accent, save){
    var root = document.documentElement;
    var resolved = theme;
    if (theme === 'auto') {
      resolved = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    root.setAttribute('data-theme', resolved);
    var rgb = hexToRgb(accent);
    var rgb2 = rgb.map(function(v){ return Math.round(v*0.85); });
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-rgb', rgb.join(', '));
    root.style.setProperty('--accent2', 'rgb(' + rgb2.join(',') + ')');
    root.style.setProperty('--accent2-rgb', rgb2.join(', '));
    if (save) { write('app_theme', theme); write('app_accent', accent); }
  }
  var cur = get();
  apply(cur.theme, cur.accent, false);
  return {themes:THEMES, accents:ACCENTS, defaults:DEFAULTS, get:get, apply:apply};
})();

      .or('hidden.is.null,hidden.eq.false')
      .order('created_at', {ascending:false})
      .abortSignal(controller.signal);
  } catch (e) {
    result = { data: null, error: e };
  } finally {
    clearTimeout(timeoutId);
    photosLoadInFlight = false;
  }

  const {data, error} = result;
  if(error){
    showError('LOAD ERROR', error);
    setTimeout(() => loadPhotos(), 800);
    return;
  }

  const fresh = data || [];
  const sig = photosSig(fresh);
  const changed = sig !== lastPhotosSig;
  lastPhotosSig = sig;
  currentPhotos = fresh;
  try { localStorage.setItem(PHOTO_CACHE_KEY, JSON.stringify(currentPhotos)); } catch (e) {}
  // The list refreshes every few seconds; only redraw the grid when something actually changed
  if (force || changed || !grid.children.length) renderGrid();
}

let websiteClosed = false;
let websiteFlashbang = false;
let websiteClosedLoadInFlight = false;

function applyWebsiteClosedState() {
  const overlay = document.getElementById('siteClosedOverlay');

  const flash = document.getElementById('flashbangOverlay');
  if (flash) flash.hidden = !websiteFlashbang;
  document.documentElement.classList.toggle('flashbanged', websiteFlashbang);
}

async function syncWebsiteClosedState() {
  if (!supabaseClient || websiteClosedLoadInFlight) return;
  websiteClosedLoadInFlight = true;
  try {
    const { data, error } = await supabaseClient
      .from('site_appearance').select('key,value').in('key', ['website_closed', 'website_flashbang']);
    if (!error) {
      const map = {};
      (data || []).forEach(r => { map[r.key] = String(r.value); });
      websiteClosed = map.website_closed === 'true';
      websiteFlashbang = map.website_flashbang === 'true';
      applyWebsiteClosedState();
    }
  } finally {

  }
}

function renderGrid(){
  grid.innerHTML = '';

  const hiddenNotice = document.getElementById('hiddenNotice');
  if(downloadsPaused){
    isSelectMode = false;
    selectedPhotoIds.clear();
    grid.classList.remove('selecting');
    empty.style.display = 'none';
    hiddenNotice.style.display = 'block';
    toggleSelectBtn.style.display = 'none';
    deleteSelectedBtn.style.display = 'none';
    selectedCountEl.style.display = 'none';
    lightbox.classList.remove('open');
    lightboxImg.removeAttribute('src');
    say('Photos are hidden.');
    return;
  }
  hiddenNotice.style.display = 'none';

  if(!currentPhotos || currentPhotos.length === 0){
    empty.style.display = 'block';
    toggleSelectBtn.style.display = 'none';
    deleteSelectedBtn.style.display = 'none';
    selectedCountEl.style.display = 'none';
    say('Connected. No photos yet.');
    return;
  }

  empty.style.display = 'none';
  // Select button is visible to everyone (while deleting is on); only deletable photos can be selected.
  if(!deleteEnabled){
    isSelectMode = false;
    selectedPhotoIds.clear();
  }
  toggleSelectBtn.style.display = deleteEnabled ? 'inline-flex' : 'none';
  say(currentPhotos.length + (currentPhotos.length === 1 ? ' photo' : ' photos') + ' loaded.');

  if(isSelectMode){
    grid.classList.add('selecting');
    deleteSelectedBtn.style.display = 'inline-flex';
    selectedCountEl.style.display = 'inline-block';
    toggleSelectBtn.classList.add('active');
    toggleSelectBtn.title = 'Cancel Selection';
  } else {
    grid.classList.remove('selecting');
    deleteSelectedBtn.style.display = 'none';
    selectedCountEl.style.display = 'none';
    toggleSelectBtn.classList.remove('active');
    toggleSelectBtn.title = 'Select Photos';
  }

  currentPhotos.forEach((photo, index) => {
    const card = document.createElement('div');
    card.className = 'card' + (selectedPhotoIds.has(photo.id) ? ' selected' : '');
    card.dataset.id = photo.id;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'select-box';
    checkbox.checked = selectedPhotoIds.has(photo.id);

    const img = document.createElement('img');
    img.alt = '';  // no file name text while the image is loading
    img.loading = index < 16 ? 'eager' : 'lazy';
    setThumb(img, photo);

    const toggleSelection = (e) => {
      e.stopPropagation();
      if(selectedPhotoIds.has(photo.id)){
        selectedPhotoIds.delete(photo.id);
        card.classList.remove('selected');
        checkbox.checked = false;
      } else {
        selectedPhotoIds.add(photo.id);
        card.classList.add('selected');
        checkbox.checked = true;
      }
      updateDeleteButton();
    };

    checkbox.addEventListener('click', (e) => {
      e.stopPropagation();
      if(checkbox.checked){
        selectedPhotoIds.add(photo.id);
        card.classList.add('selected');
      } else {
        selectedPhotoIds.delete(photo.id);
        card.classList.remove('selected');
      }
      updateDeleteButton();
    });

    if(!canDelete(photo)) card.classList.add('not-mine');

    card.addEventListener('click', (e) => {
      if(isSelectMode){
        if(!canDelete(photo)){
          say('You can only select photos you uploaded.');
          return;
        }
        toggleSelection(e);
      } else {
        openLightbox(index);
      }
    });

    if(canDelete(photo)) card.appendChild(checkbox);
    card.appendChild(img);
    grid.appendChild(card);
  });

  updateDeleteButton();
}

/* Process Deletion after Password Check */
async function runDelete(){
  passwordModal.classList.remove('open');

  deleteSelectedBtn.classList.add('deleting');
  deleteSelectedBtn.disabled = true;

  // Only delete photos this device is allowed to delete (own photos, or any if the admin allows it)
  const idsToDelete = Array.from(selectedPhotoIds).filter(id => canDelete(currentPhotos.find(p => p.id === id)));

  idsToDelete.forEach(id => {
    const cardEl = grid.querySelector(`.card[data-id="${id}"]`);
    if(cardEl) cardEl.classList.add('deleting-card');
  });

  say('Deleting selected photos...');

  let delQuery = supabaseClient.from('photos').delete().in('id', idsToDelete);
  if(!anyoneCanDelete) delQuery = delQuery.eq('owner_id', DEVICE_ID);
  const {data: deletedRows, error: delErr} = await delQuery.select('id,path,thumb_path');
  if(!delErr && deletedRows && deletedRows.length){
    const files = [];
    deletedRows.forEach(r => { if(r.path) files.push(r.path); if(r.thumb_path) files.push(r.thumb_path); });
    if(files.length){
      try {
        const rm = await supabaseClient.storage.from(BUCKET).remove(files);
        if(rm.error) console.warn('Storage cleanup failed', rm.error);
      } catch (e) { console.warn('Storage cleanup failed', e); }
    }
  }
  const error = delErr || ((!deletedRows || deletedRows.length === 0)
    ? { message: 'Delete was blocked by the database (no rows deleted). Check the DELETE policy on the photos table.' }
    : null);

  setTimeout(async () => {
    deleteSelectedBtn.classList.remove('deleting');
    if(error){
      showError('DELETE ERROR', error);
      updateDeleteButton();
      return;
    }

    selectedPhotoIds.clear();
    isSelectMode = false;
    await loadPhotos(true);
  }, 400);
}

function canvasBlob(canvas, quality){
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('Could not encode the image.')), 'image/jpeg', quality);
  });
}

function loadImageFromFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read the image.')); };
    img.src = url;
  });
}

function drawScaled(img, maxSize){
  let w = img.naturalWidth, h = img.naturalHeight;
  if(w > maxSize || h > maxSize){
    const scale = Math.min(maxSize / w, maxSize / h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, w);
  canvas.height = Math.max(1, h);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas;
}

async function prepareImage(file, maxSize = 1600, quality = .82){
  setProgress(20);
  const img = await loadImageFromFile(file);
  setProgress(40);
  const fullCanvas = drawScaled(img, maxSize);
  const thumbCanvas = drawScaled(img, THUMB_SIZE);
  const [full, thumb] = await Promise.all([canvasBlob(fullCanvas, quality), canvasBlob(thumbCanvas, .72)]);
  setProgress(60);
  return { full, thumb, w: fullCanvas.width, h: fullCanvas.height };
}

function newFileId(){
  return crypto.randomUUID ? crypto.randomUUID()
    : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
}

async function getCurrentUploaderInfo(){
  const ua = navigator.userAgent || '';
  let device = '', os = 'Unknown OS', browser = 'Unknown browser';
  const type = /iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) ? 'Tablet'
             : /Mobi|iPhone|Android/i.test(ua) ? 'Mobile' : 'Desktop';
  if (/Android/i.test(ua)) {
    const v = (ua.match(/Android\s([\d.]+)/) || [])[1];
    os = 'Android' + (v ? ' ' + v : '');
    const m = ua.match(/;\s*([^;)]+?)\s+Build\//) || ua.match(/Android[^;]*;\s*([^;)]+)\)/);
    if (m) device = m[1].trim();
  } else if (/iPhone/i.test(ua)) {
    const v = (ua.match(/OS\s([\d_]+)/) || [])[1];
    os = 'iOS' + (v ? ' ' + v.replace(/_/g, '.') : ''); device = 'iPhone';
  } else if (/iPad/i.test(ua)) { os = 'iPadOS'; device = 'iPad'; }
  else if (/Windows/i.test(ua)) { os = 'Windows'; device = 'Windows PC'; }
  else if (/Mac OS X/i.test(ua)) { os = 'macOS'; device = 'Mac'; }
  else if (/CrOS/i.test(ua)) { os = 'ChromeOS'; device = 'Chromebook'; }
  else if (/Linux/i.test(ua)) { os = 'Linux'; device = 'Linux PC'; }
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion']);
      if (h.model) device = h.model;
      if (h.platform && /Windows/i.test(h.platform) && h.platformVersion) {
        os = parseInt(h.platformVersion,10) >= 13 ? 'Windows 11' : 'Windows 10';
      }
    }
  } catch(e) {}
  if (/SamsungBrowser/i.test(ua)) browser = 'Samsung Internet';
  else if (/Edg\//i.test(ua)) browser = 'Edge';
  else if (/OPR\/|Opera/i.test(ua)) browser = 'Opera';
  else if (/Firefox|FxiOS/i.test(ua)) browser = 'Firefox';
  else if (/Chrome|CriOS/i.test(ua)) browser = 'Chrome';
  else if (/Safari/i.test(ua)) browser = 'Safari';
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
  return {
    auth_id: DEVICE_ID || '',
    device_id: getDeviceId(),
    online_at: new Date().toISOString(),
    device: device || 'Unknown device', type, os, browser,
    screen: (screen.width || 0) + '×' + (screen.height || 0),
    lang: navigator.language || '', tz
  };
}

async function addPhotos(fileList){
  const files = Array.from(fileList || []);
  if(files.length === 0) return;

  if(!supabaseClient){
    say('Supabase is not initialized.');
    return;
  }

  if(isUploading){
    say('An upload is already in progress. Please wait.');
    return;
  }

  if(!(await ensureAuth())){
    say('Could not verify your device. Please refresh and try again.');
    return;
  }

  await syncUploadState();
  if(uploadsPaused || uploadButtonRemoved){
    say('Uploads are currently paused.');
    return;
  }

  // Per-person daily limit (set from the admin dashboard)
  let limitLeft = null;
  let dailyOver = 0;
  if(dailyUploadLimit > 0){
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    const { count, error: cErr } = await supabaseClient
      .from('photos')
      .select('id', { count: 'exact', head: true })
      .eq('owner_id', DEVICE_ID)
      .gte('created_at', start.toISOString());
    if(!cErr){
      limitLeft = dailyUploadLimit - (count || 0);
      if(limitLeft <= 0){
        say('Daily upload limit reached (' + dailyUploadLimit + (dailyUploadLimit === 1 ? ' photo' : ' photos') + ' per day). Try again tomorrow.');
        return;
      }
    }
  }

  const images = files.filter(f => f && f.type && f.type.startsWith('image/'));
  if(images.length === 0){
    say('Please select an image.');
    return;
  }
  const skipped = files.length - images.length;

  let overLimit = 0;
  if(images.length > MAX_UPLOAD_BATCH){
    overLimit = images.length - MAX_UPLOAD_BATCH;
    images.length = MAX_UPLOAD_BATCH;
  }
  if(limitLeft !== null && images.length > limitLeft){
    dailyOver = images.length - limitLeft;
    images.length = limitLeft;
  }

  isUploading = true;
  let uploaded = 0;
  const failed = [];
  let stopped = false;

  try{
    for(let i = 0; i < images.length; i++){
      if(uploadsPaused){ stopped = true; break; }

      batch = { index: i, total: images.length };
      const file = images[i];
      say(images.length > 1 ? `Uploading ${i + 1} of ${images.length}...` : 'Uploading...');
      setProgress(10);

      try{
        const prepared = await prepareImage(file);
        const fid = newFileId();
        const fullPath = 'full/' + fid + '.jpg';
        const thumbPath = 'thumb/' + fid + '.jpg';
        const bucket = supabaseClient.storage.from(BUCKET);
        const opts = { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false };

        let up = await bucket.upload(fullPath, prepared.full, opts);
        if(up.error) throw up.error;
        setProgress(75);
        up = await bucket.upload(thumbPath, prepared.thumb, opts);
        if(up.error){ await bucket.remove([fullPath]); throw up.error; }
        setProgress(90);

        const {error} = await supabaseClient
          .from('photos')
          .insert({
            name: file.name,
            owner_id: DEVICE_ID,
            uploader_info: await getCurrentUploaderInfo(),
            path: fullPath,
            thumb_path: thumbPath,
            size: prepared.full.size + prepared.thumb.size,
            img_w: prepared.w,
            img_h: prepared.h
          });

        if(error){ await bucket.remove([fullPath, thumbPath]); throw error; }
        setProgress(100);
        uploaded++;
      }catch(err){
        console.error('UPLOAD ERROR', file.name, err);
        failed.push(file.name || 'photo');
      }
    }
  } finally {
    isUploading = false;
    batch = { index: 0, total: 1 };
  }

  setTimeout(() => setProgress(0), 1000);
  await loadPhotos();

  let msg = uploaded + (uploaded === 1 ? ' photo' : ' photos') + ' uploaded successfully.';
  if(images.length > 1) msg = uploaded + ' of ' + images.length + ' photos uploaded.';
  if(failed.length) msg += ' Failed: ' + failed.join(', ') + '.';
  if(stopped) msg += ' Uploads were paused, so the rest were skipped.';
  if(overLimit) msg += ' Limit is ' + MAX_UPLOAD_BATCH + ' photos at a time, so ' + overLimit + ' extra ' + (overLimit === 1 ? 'photo was' : 'photos were') + ' not uploaded.';
  if(skipped) msg += ' ' + skipped + ' non-image file' + (skipped === 1 ? '' : 's') + ' skipped.';
  if(dailyOver) msg += ' Daily limit is ' + dailyUploadLimit + ' per day, so ' + dailyOver + ' ' + (dailyOver === 1 ? 'photo was' : 'photos were') + ' not uploaded.';
  say(msg);
}

/* Appearance: theme & accent are controlled from the admin dashboard */
(function(){
  const A = window.APPEARANCE;

  async function syncAppearance(){
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('site_appearance')
        .select('value')
        .eq('key', 'appearance')
        .maybeSingle();
      if (error || !data || !data.value) return;
      const v = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
      if (!v || !A.themes[v.theme] || !/^#[0-9a-fA-F]{6}$/.test(v.accent || '')) return;
      const cur = A.get();
      if (cur.theme !== v.theme || cur.accent.toLowerCase() !== v.accent.toLowerCase()) {
        A.apply(v.theme, v.accent, true);
      }
    } catch (e) { console.error('Appearance sync failed', e); }
  }

  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: light)');
    const onChange = () => { const c = A.get(); if (c.theme === 'auto') A.apply(c.theme, c.accent, false); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  syncAppearance();
  setInterval(syncAppearance, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncAppearance(); });
  try {
    if (supabaseClient && supabaseClient.channel) {
      supabaseClient.channel('site-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'site_appearance' }, () => { syncAppearance(); syncUploadState(); syncWebsiteClosedState(); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'photos' }, () => { loadPhotos(); })
        .subscribe();
    }
  } catch (e) { console.warn('Realtime unavailable, using polling', e); }
})();

let downloadsPaused = false;
let __downloadStateConfirmed = false;
try { downloadsPaused = localStorage.getItem('app_downloads_paused') === 'true'; } catch (e) {}
let downloadProtect = false;   // admin setting: block saving/right-click/print
try { downloadProtect = localStorage.getItem('app_download_protect') === 'true'; } catch (e) {}
window.__downloadStateConfirmed = false;

function protectOn(){ return downloadsPaused || downloadProtect; }

function applyDownloadState(){
  const on = protectOn();
  document.documentElement.classList.toggle('no-download', on);
  lightboxImg.draggable = !on;
}

async function syncUploadState(){
  if(!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('site_appearance')
      .select('key,value')
      .in('key', ['uploads_paused', 'downloads_paused', 'delete_enabled', 'anyone_can_delete', 'delete_password_enabled', 'upload_button_removed', 'daily_upload_limit', 'download_protection']);
    if (error) return;
    const map = {};
    (data || []).forEach(r => { map[r.key] = String(r.value); });
    uploadsPaused = map.uploads_paused === 'true';
    uploadButtonRemoved = map.upload_button_removed === 'true';
    deletePasswordEnabled = map.delete_password_enabled !== 'false';
    dailyUploadLimit = parseInt(map.daily_upload_limit, 10) || 0;
    const prevDel = deleteEnabled, prevAny = anyoneCanDelete;
    deleteEnabled = map.delete_enabled !== 'false';
    anyoneCanDelete = map.anyone_can_delete === 'true';
    if (prevDel !== deleteEnabled || prevAny !== anyoneCanDelete) renderGrid();
    const wasPaused = downloadsPaused;
    downloadsPaused = map.downloads_paused === 'true';
    __downloadStateConfirmed = true;
    window.__downloadStateConfirmed = true;
    try { localStorage.setItem('app_downloads_paused', String(downloadsPaused)); } catch (e) {}
    downloadProtect = map.download_protection === 'true';
    try { localStorage.setItem('app_download_protect', String(downloadProtect)); } catch (e) {}
    applyUploadState();
    applyDownloadState();
    if (wasPaused !== downloadsPaused) loadPhotos(true);
  } catch (e) { console.error('Upload/download state sync failed', e); }
}

  if (!protectOn()) return;
  const k = (e.key || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p')) e.preventDefault();
});

drop.addEventListener('click', (e) => {
  if (uploadsPaused) e.preventDefault();
});

/* Live visitor count: each open browser joins a presence channel; the dashboard counts them */
(async function(){
  try {
    if (!supabaseClient || !supabaseClient.channel) return;
    // The photos table stores the authenticated anonymous user id in owner_id.
    // Use that same id as the presence key so the dashboard can match uploads to live visitors.
    await ensureAuth();
    const presenceKey = DEVICE_ID || getDeviceId();
    const presenceChannel = supabaseClient.channel('site-online', {
      config: { presence: { key: presenceKey } }
    });
    const getVisitorInfo = async () => {
      const info = await getCurrentUploaderInfo();
      info.auth_id = presenceKey;
      return info;
    };
    presenceChannel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        try { await presenceChannel.track(await getVisitorInfo()); } catch (e) {}
      }
    });
  } catch (e) { console.warn('Presence unavailable', e); }
})();

/* Visit log: one row per device per day, used for the dashboard's activity chart */
(async function(){
  try {
    if (!supabaseClient) return;
    const d = new Date();
    const day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (localStorage.getItem('photo_base_last_visit') === day) return;
    const { error } = await supabaseClient.from('visits').insert({ device_id: getDeviceId(), day: day });
    if (!error || error.code === '23505') localStorage.setItem('photo_base_last_visit', day);
  } catch (e) {}
})();

applyDownloadState();
syncWebsiteClosedState();
setInterval(syncWebsiteClosedState, 5000);
if (currentPhotos.length) renderGrid(); else say('Loading photos...');
loadPhotos();   // the list is public, so start right away; sign-in only decides which photos are yours
ensureAuth().then(() => { if (currentPhotos.length) renderGrid(); syncUploadState(); });
syncUploadState();
setInterval(syncUploadState, 10000);
setInterval(loadPhotos, 10000);
</script>
