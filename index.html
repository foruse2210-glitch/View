<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Base</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  box-sizing: border-box;
}

:root {
  --accent: #0a84ff;
  --accent-rgb: 10, 132, 255;
  --accent2: #0071e3;
  --accent2-rgb: 0, 113, 227;
}

:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-rgb: 0, 0, 0;
  --fg-rgb: 255, 255, 255;
  --text: #ffffff;
  --muted: #86868b;
  --modal-bg: rgba(30, 30, 32, 0.85);
  --shadow-k: 1;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f7;
  --bg-rgb: 255, 255, 255;
  --fg-rgb: 0, 0, 0;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --modal-bg: rgba(255, 255, 255, 0.92);
  --shadow-k: 0.18;
}

:root[data-theme="midnight"] {
  color-scheme: dark;
  --bg: #0a1128;
  --bg-rgb: 10, 17, 40;
  --fg-rgb: 255, 255, 255;
  --text: #eaf0ff;
  --muted: #8a96b8;
  --modal-bg: rgba(18, 28, 60, 0.9);
  --shadow-k: 1;
}

:root[data-theme="warm"] {
  color-scheme: dark;
  --bg: #1a1410;
  --bg-rgb: 26, 20, 16;
  --fg-rgb: 255, 244, 230;
  --text: #f5ece0;
  --muted: #a39682;
  --modal-bg: rgba(44, 34, 27, 0.92);
  --shadow-k: 1;
}


:root[data-theme="ocean"] { color-scheme: dark; --bg:#06181f; --bg-rgb:6,24,31; --fg-rgb:230,250,255; --text:#e3f6fb; --muted:#7fa3ad; --modal-bg:rgba(10,36,46,0.92); --shadow-k:1; }
:root[data-theme="forest"] { color-scheme: dark; --bg:#0a1a12; --bg-rgb:10,26,18; --fg-rgb:235,255,240; --text:#e6f6ea; --muted:#7fa38c; --modal-bg:rgba(18,40,28,0.92); --shadow-k:1; }
:root[data-theme="rose"] { color-scheme: dark; --bg:#1c0f17; --bg-rgb:28,15,23; --fg-rgb:255,235,244; --text:#f8e8ef; --muted:#a68a99; --modal-bg:rgba(44,24,36,0.92); --shadow-k:1; }
:root[data-theme="paper"] { color-scheme: light; --bg:#f6f1e7; --bg-rgb:255,250,240; --fg-rgb:40,30,20; --text:#2b2118; --muted:#7a6d5e; --modal-bg:rgba(255,252,245,0.94); --shadow-k:0.18; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  padding: 40px 20px 24px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(var(--bg-rgb), 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(var(--fg-rgb), 0.15);
}

h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}

.subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
  font-weight: 400;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 16px;
}

/* Upload Drop Area - Rounded Glass Container */
#drop {
  display: block;
  border-radius: 20px;
  padding: 42px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  background: rgba(var(--fg-rgb), 0.03);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  box-shadow: inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
}

#drop:hover {
  background: rgba(var(--fg-rgb), 0.08);
  border-color: rgba(var(--fg-rgb), 0.45);
}

#drop strong {
  display: block;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

#drop span {
  color: var(--muted);
  font-size: 14px;
}

#file {
  display: none;
}

/* Download protection (toggled from the admin dashboard) */
.no-download img {
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
}

.no-download .card img {
  pointer-events: none;
}

@media print {
  .no-download body { display: none !important; }
}

#drop.paused {
  opacity: 0.55;
  cursor: not-allowed;
  border-style: dashed;
}

#drop.paused:hover {
  background: rgba(var(--fg-rgb), 0.03);
  border-color: rgba(var(--fg-rgb), 0.2);
}

/* Progress Bar Styling */
.progress-container {
  display: none;
  width: 100%;
  max-width: 400px;
  height: 8px;
  background: rgba(var(--fg-rgb), 0.1);
  border-radius: 10px;
  margin: 18px auto 8px auto;
  overflow: hidden;
  border: 1px solid rgba(var(--fg-rgb), 0.15);
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 10px;
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.6);
}

#status {
  margin: 8px 0 18px 0;
  text-align: center;
  color: var(--muted);
  min-height: 20px;
  font-size: 14px;
  font-weight: 400;
  word-break: break-word;
}

/* Sticky Liquid Floating Toolbar */
.toolbar {
  position: sticky;
  top: 100px;
  z-index: 20;
  background: rgba(var(--bg-rgb), 0.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid rgba(var(--fg-rgb), 0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, calc(0.5 * var(--shadow-k)));
}

.toolbar-left {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* Selected Counter Badge */
.selected-count {
  display: none;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.15);
  border: 1px solid rgba(var(--accent-rgb), 0.3);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}

/* Base Rounded Glass Button */
.btn-round {
  height: 44px;
  border-radius: 22px;
  background: rgba(var(--fg-rgb), 0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  box-shadow: inset 0 1px 1px rgba(var(--fg-rgb), 0.25);
  outline: none !important;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round:hover:not(:disabled) {
  background: rgba(var(--fg-rgb), 0.15);
  border-color: rgba(var(--fg-rgb), 0.45);
  transform: translateY(-2px);
}

.btn-round:active {
  transform: scale(0.96) !important;
}

.btn-icon-only {
  width: 44px;
}

/* Keyframe Animations for Password Gear Icon */
@keyframes gearSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3); }
  50% { box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.7); }
  100% { box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3); }
}

/* Enhanced Change Password Button */
.btn-password-change {
  padding: 0 18px 0 14px;
  gap: 8px;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.25), rgba(var(--accent2-rgb), 0.15));
  border: 1px solid rgba(var(--accent-rgb), 0.4);
  animation: pulseGlow 3s infinite ease-in-out;
}

.btn-password-change:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.45), rgba(var(--accent2-rgb), 0.35));
  border-color: rgba(var(--accent-rgb), 0.7);
  box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5);
}

.btn-password-change svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-password-change:hover svg {
  animation: gearSpin 1.8s linear infinite;
}

/* Select Button */
.btn-round-select {
  color: var(--text);
}

.btn-round-select.active {
  background: rgba(var(--accent2-rgb), 0.9);
  border-color: rgba(var(--fg-rgb), 0.5);
  color: #fff;
  box-shadow: 0 0 20px rgba(var(--accent2-rgb), 0.6) !important;
}

.btn-round-select svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round-select.active svg {
  transform: rotate(360deg);
}

/* Delete Button */
.btn-round-delete {
  color: #ff453a;
  background: rgba(255, 69, 58, 0.12);
  border-color: rgba(255, 69, 58, 0.3);
}

.btn-round-delete:hover:not(:disabled) {
  background: rgba(255, 69, 58, 0.25);
  border-color: rgba(255, 69, 58, 0.5);
  box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
}

.btn-round-delete:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.btn-round-delete svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Shake Animation */
@keyframes shakeTrash {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(-10deg); }
  40% { transform: rotate(10deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}

.btn-round-delete.deleting {
  animation: shakeTrash 0.5s ease-in-out infinite;
  background: rgba(255, 69, 58, 0.9) !important;
  color: #fff !important;
}

/* Masonry Grid & Cards */
.grid {
  columns: 4 220px;
  column-gap: 18px;
}

.card {
  break-inside: avoid;
  margin: 0 0 18px;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(var(--fg-rgb), 0.04);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.18);
  box-shadow: 0 10px 30px rgba(0, 0, 0, calc(0.8 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
  cursor: pointer;
  user-select: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(var(--fg-rgb), 0.4);
  box-shadow: 0 16px 40px rgba(0, 0, 0, calc(0.9 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.35);
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  transition: opacity 0.3s ease;
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 12px 36px rgba(var(--accent-rgb), 0.45);
}

.card.deleting-card {
  opacity: 0;
  transform: scale(0.9);
}

/* Custom Checkbox Overlay */
.select-box {
  display: none;
  position: absolute;
  top: 12px;
  left: 12px;
  width: 22px;
  height: 22px;
  z-index: 5;
  cursor: pointer;
  accent-color: var(--accent);
  outline: none;
  border-radius: 4px;
}

.selecting .select-box {
  display: block;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 10px;
  font-size: 15px;
}

/* Lightbox Glass Overlay & Navigation Arrows */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 88vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.close {
  position: absolute;
  right: 24px;
  top: 20px;
  font-size: 28px;
  color: #ffffff;
  cursor: pointer;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  transition: all 0.2s ease;
  z-index: 102;
}

.close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.2s ease;
  z-index: 101;
  user-select: none;
}

.lightbox-arrow:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-50%) scale(1.08);
}

.lightbox-arrow svg {
  width: 28px;
  height: 28px;
  fill: currentColor;
}

.lightbox-prev {
  left: 20px;
}

.lightbox-next {
  right: 20px;
}

/* Glass Modals */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(var(--bg-rgb), 0.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  z-index: 105;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: var(--modal-bg);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, calc(0.8 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
}

.modal-content h3 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
}

.modal-content p {
  margin: 0 0 20px;
  font-size: 14px;
  color: var(--muted);
}

/* Input Wrappers with Password Toggle Eye Button */
.input-field-group {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

.input-field-group input {
  width: 100%;
  padding: 12px 42px 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  background: rgba(var(--bg-rgb), 0.5);
  color: var(--text);
  font-size: 16px;
  outline: none;
  text-align: left;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-field-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3);
}

.toggle-eye-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: color 0.2s ease;
}

.toggle-eye-btn:hover {
  color: var(--text);
}

.toggle-eye-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.modal-btn-cancel {
  background: rgba(var(--fg-rgb), 0.1);
  color: var(--text);
}

.modal-btn-cancel:hover {
  background: rgba(var(--fg-rgb), 0.2);
}

.modal-btn-confirm {
  background: #ff453a;
  color: #fff;
}

.modal-btn-confirm:hover {
  background: #ff6961;
}

.modal-btn-primary {
  background: var(--accent);
  color: #fff;
}

.modal-btn-primary:hover {
  background: var(--accent2);
}


@media(max-width: 650px) {
  h1 { font-size: 28px; }
  .grid { columns: 2 150px; }
  .btn-password-change span { display: none; }
  .btn-password-change { padding: 0 12px; }
  .toolbar { top: 90px; }
  .lightbox-prev { left: 10px; }
  .lightbox-next { right: 10px; }
  .lightbox-arrow { width: 40px; height: 40px; }
  .lightbox-arrow svg { width: 22px; height: 22px; }
}
</style>
<script>
window.APPEARANCE = (function(){
  var THEMES = {
    auto:     {name:'Auto',     bg:'linear-gradient(90deg,#000 50%,#f5f5f7 50%)'},
    dark:     {name:'Dark',     bg:'#000000'},
    light:    {name:'Light',    bg:'#f5f5f7'},
    midnight: {name:'Midnight', bg:'#0a1128'},
    warm:     {name:'Warm',     bg:'#1a1410'},
    ocean:    {name:'Ocean',    bg:'#06181f'},
    forest:   {name:'Forest',   bg:'#0a1a12'},
    rose:     {name:'Rose',     bg:'#1c0f17'},
    paper:    {name:'Paper',    bg:'#f6f1e7'}
  };
  var ACCENTS = [
    {name:'Blue',   hex:'#0a84ff'},
    {name:'Purple', hex:'#bf5af2'},
    {name:'Pink',   hex:'#ff375f'},
    {name:'Orange', hex:'#ff9f0a'},
    {name:'Green',  hex:'#30d158'},
    {name:'Teal',   hex:'#40c8e0'},
    {name:'Red',    hex:'#ff453a'},
    {name:'Yellow', hex:'#ffd60a'},
    {name:'Indigo', hex:'#5e5ce6'},
    {name:'Mint',   hex:'#63e6be'},
    {name:'Coral',  hex:'#ff7a59'},
    {name:'Lime',   hex:'#a3e635'}
  ];
  var DEFAULTS = {theme:'dark', accent:'#0a84ff'};
  function read(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } }
  function write(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function hexToRgb(h){
    h = String(h).replace('#','');
    if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
    var n = parseInt(h, 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function get(){
    var t = read('app_theme', DEFAULTS.theme);
    var a = read('app_accent', DEFAULTS.accent);
    if (!THEMES[t]) t = DEFAULTS.theme;
    if (!/^#[0-9a-fA-F]{6}$/.test(a)) a = DEFAULTS.accent;
    return {theme:t, accent:a};
  }
  function apply(theme, accent, save){
    var root = document.documentElement;
    var resolved = theme;
    if (theme === 'auto') {
      resolved = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    root.setAttribute('data-theme', resolved);
    var rgb = hexToRgb(accent);
    var rgb2 = rgb.map(function(v){ return Math.round(v*0.85); });
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-rgb', rgb.join(', '));
    root.style.setProperty('--accent2', 'rgb(' + rgb2.join(',') + ')');
    root.style.setProperty('--accent2-rgb', rgb2.join(', '));
    if (save) { write('app_theme', theme); write('app_accent', accent); }
  }
  var cur = get();
  apply(cur.theme, cur.accent, false);
  return {themes:THEMES, accents:ACCENTS, defaults:DEFAULTS, get:get, apply:apply};
})();
</script>
</head>
<body>
<header>
  <h1>Photo Base</h1>
  <div class="subtitle">Anyone can upload photos here</div>
</header>

<main>
  <label id="drop" for="file" tabindex="0">
    <strong>Upload Photos</strong>
    <span>Tap here to add photos</span>
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <div id="progressContainer" class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>
